<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop QR & Barcode Scanner</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --accent: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Card Styles */
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }

        /* Scanner Area */
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 300px;
        }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 10px; background: #eef2ff; color: var(--secondary); border-bottom: 2px solid #e0e7ff; }
        td { padding: 10px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
        
        .qty-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            text-align: center;
        }

        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: #fecaca; }
        .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-primary:hover { background: var(--secondary); }

        /* Summary Section */
        .summary-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .total-row { font-size: 1.2rem; font-weight: bold; color: var(--primary); border-top: 2px solid #cbd5e1; padding-top: 10px; }
        
        .discount-input {
            width: 80px;
            padding: 5px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        /* Modal / Preview */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* Bill Preview Styling */
        #bill-preview {
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border: 1px dashed #ccc;
        }
        .bill-header { text-align: center; margin-bottom: 20px; }
        .bill-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .bill-total { border-top: 1px dashed #000; margin-top: 10px; padding-top: 5px; display: flex; justify-content: space-between; font-weight: bold; }

        .actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Column: Scanner -->
    <div class="card">
        <h2><i class="fas fa-qrcode"></i> Scan Item</h2>
        <div id="reader"></div>
        <p style="text-align: center; color: #666; font-size: 0.9rem; margin-top: 10px;">
            Point camera at QR or Barcode. Value auto-added as ₹100.
        </p>
    </div>

    <!-- Right Column: Cart & Totals -->
    <div class="card">
        <h2><i class="fas fa-shopping-cart"></i> Current Bill</h2>
        
        <div style="overflow-x: auto;">
            <table id="item-table">
                <thead>
                    <tr>
                        <th>Item Code/ID</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                    <!-- Items injected here -->
                </tbody>
            </table>
            <div id="empty-msg" style="text-align: center; padding: 20px; color: #9ca3af;">No items scanned yet</div>
        </div>

        <div class="summary-box">
            <div class="row">
                <span>Subtotal:</span>
                <span id="subtotal">₹0.00</span>
            </div>
            <div class="row">
                <span>Discount (%):</span>
                <input type="number" id="discount-rate" class="discount-input" value="0" min="0" max="100">
            </div>
            <div class="row">
                <span>Discount Amount:</span>
                <span id="discount-amount">₹0.00</span>
            </div>
            <div class="row total-row">
                <span>Grand Total:</span>
                <span id="grand-total">₹0.00</span>
            </div>
        </div>

        <button class="btn btn-primary" onclick="showBillPreview()">
            <i class="fas fa-file-invoice"></i> View & Print Bill
        </button>
    </div>
</div>

<!-- Bill Preview Modal -->
<div id="bill-modal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin:0;">Bill Preview</h3>
            <button class="btn btn-danger" onclick="closeModal()">X</button>
        </div>
        
        <div id="bill-preview">
            <!-- Bill Content Generated Here -->
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="generatePDF()">
                <i class="fas fa-print"></i> Download PDF
            </button>
            <button class="btn" style="background:#9ca3af; color:white;" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<script>
    // --- State Management ---
    let cart = [];
    const ITEM_PRICE = 100; // Default value as requested

    // --- Scanner Initialization ---
    function onScanSuccess(decodedText, decodedResult) {
        // Prevent duplicate rapid scans
        if (window.lastScan === decodedText && Date.now() - window.lastScanTime < 2000) return;
        
        window.lastScan = decodedText;
        window.lastScanTime = Date.now();

        // Visual feedback
        const reader = document.getElementById('reader');
        reader.style.border = "2px solid #10b981";
        setTimeout(() => reader.style.border = "none", 200);

        addToCart(decodedText);
    }

    // --- Cart Logic ---
    function addToCart(code) {
        const existingItem = cart.find(item => item.code === code);
        
        if (existingItem) {
            existingItem.qty++;
        } else {
            cart.push({
                code: code,
                price: ITEM_PRICE,
                qty: 1
            });
        }
        renderCart();
    }

    function updateQty(code, newQty) {
        const item = cart.find(i => i.code === code);
        if (item) {
            item.qty = Math.max(1, parseInt(newQty));
            renderCart();
        }
    }

    function deleteItem(code) {
        cart = cart.filter(item => item.code !== code);
        renderCart();
    }

    function renderCart() {
        const tbody = document.getElementById('cart-body');
        const emptyMsg = document.getElementById('empty-msg');
        tbody.innerHTML = '';

        if (cart.length === 0) {
            emptyMsg.style.display = 'block';
        } else {
            emptyMsg.style.display = 'none';
            cart.forEach(item => {
                const total = item.price * item.qty;
                const row = `
                    <tr>
                        <td><strong>${item.code}</strong></td>
                        <td>₹${item.price}</td>
                        <td>
                            <input type="number" class="qty-input" value="${item.qty}" 
                                onchange="updateQty('${item.code}', this.value)">
                        </td>
                        <td>₹${total.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteItem('${item.code}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        calculateTotals();
    }

    function calculateTotals() {
        let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const discountRate = parseFloat(document.getElementById('discount-rate').value) || 0;
        const discountAmount = subtotal * (discountRate / 100);
        const grandTotal = subtotal - discountAmount;

        document.getElementById('subtotal').innerText = `₹${subtotal.toFixed(2)}`;
        document.getElementById('discount-amount').innerText = `₹${discountAmount.toFixed(2)}`;
        document.getElementById('grand-total').innerText = `₹${grandTotal.toFixed(2)}`;
    }

    // Listen for discount changes
    document.getElementById('discount-rate').addEventListener('input', calculateTotals);

    // --- Bill Preview & PDF ---
    function showBillPreview() {
        if (cart.length === 0) {
            alert("Cart is empty!");
            return;
        }

        const date = new Date().toLocaleString();
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const discountRate = parseFloat(document.getElementById('discount-rate').value) || 0;
        const discountAmount = subtotal * (discountRate / 100);
        const grandTotal = subtotal - discountAmount;

        let itemsHtml = '';
        cart.forEach(item => {
            itemsHtml += `
                <div class="bill-item">
                    <span>${item.code} x ${item.qty}</span>
                    <span>₹${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `;
        });

        const billHtml = `
            <div class="bill-header">
                <h3>SHOP NAME</h3>
                <p>123 Market Street, City</p>
                <p>Date: ${date}</p>
                <p>--------------------------------</p>
            </div>
            <div style="margin-bottom: 10px;">
                ${itemsHtml}
            </div>
            <div style="border-top: 1px dashed #000; margin-top: 10px; padding-top: 5px;">
                <div class="bill-item"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
                <div class="bill-item"><span>Discount (${discountRate}%)</span><span>₹${discountAmount.toFixed(2)}</span></div>
                <div class="bill-total"><span>TOTAL</span><span>₹${grandTotal.toFixed(2)}</span></div>
            </div>
            <div style="text-align: center; margin-top: 20px; font-size: 0.8rem;">
                Thank you for shopping!
            </div>
        `;

        document.getElementById('bill-preview').innerHTML = billHtml;
        document.getElementById('bill-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('bill-modal').style.display = 'none';
    }

    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('bill-preview');
        
        // Use html2canvas to capture the bill div
        const canvas = await html2canvas(element, { scale: 2 });
        const imgData = canvas.toDataURL('image/png');
        
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        
        pdf.addImage(imgData, 'PNG', 0, 10, pdfWidth, pdfHeight);
        pdf.save('bill.pdf');
    }

    // --- Start Scanner ---
    // Note: Requires HTTPS or localhost
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 };
                        

    html5QrCode.start(
        { facingMode: "environment" }, // Prefer back camera
        config,
        onScanSuccess,
        (errorMessage) => {
            // Ignore scan errors (e.g., no barcode found) to avoid console spam
            // console.log("Scan error: " + errorMessage); 
        }
    ).catch(err => {
        console.error("Error starting scanner:", err);
        document.getElementById('reader').innerHTML = 
            `<div style="color:red; padding:20px; text-align:center;">
                <i class="fas fa-exclamation-triangle"></i><br>
                Camera access failed.<br>
                Please ensure you are using <strong>HTTPS</strong> or <strong>localhost</strong>.
            </div>`;
    });

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('bill-modal');
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
