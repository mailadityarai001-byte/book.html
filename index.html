<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode and QR Reader POS System</title>
    <style>
        /* Add some basic styling to our POS system */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .pos-container {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .cart-pane {
            margin-bottom: 20px;
        }
        .cart-item {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .total-pane {
            margin-top: 20px;
        }
        .total-pane .total {
            font-weight: bold;
        }
        .discount-pane {
            margin-top: 20px;
        }
        .discount-pane .discount {
            font-weight: bold;
        }
        .print-pane {
            margin-top: 20px;
        }
        .print-pane .print {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="pos-container">
        <div class="cart-pane">
            <h2>Cart</h2>
            <div id="cart-items"></div>
        </div>
        <div class="total-pane">
            <h2>Total</h2>
            <div id="total"></div>
        </div>
        <div class="discount-pane">
            <h2>Discount</h2>
            <input type="number" id="discount" placeholder="Enter discount percentage">
            <button id="apply-discount">Apply</button>
        </div>
        <div class="print-pane">
            <h2>Print</h2>
            <button id="print-btn">Print to PDF</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.1.0/dist/jsQR.js"></script>
    <script>
        // Define the barcode and QR code data
        const barcodeData = {
            '100100100': {
                name: 'AMUL BUTTER',
                price: 100
            }
        };

        // Define the cart and total
        let cart = [];
        let total = 0;

        // Function to add an item to the cart
        function addItemToCart(item) {
            const existingItem = cart.find(cartItem => cartItem.barcode === item.barcode);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            updateCart();
        }

        // Function to update the cart
        function updateCart() {
            const cartItemsHtml = cart.map((item, index) => {
                return `
                    <div class="cart-item">
                        <div>Barcode: ${item.barcode}</div>
                        <div>Quantity: ${item.quantity}</div>
                        <div>Price: ₹${item.price}</div>
                        <div>Subtotal: ₹${item.price * item.quantity}</div>
                        <button class="delete-btn" data-index="${index}">Delete</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-items').innerHTML = cartItemsHtml;
            calculateTotal();
        }

        // Function to calculate the total
        function calculateTotal() {
            total = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);
            document.getElementById('total').innerHTML = `Total: ₹${total}`;
        }

        // Function to apply discount
        function applyDiscount() {
            const discount = parseInt(document.getElementById('discount').value);
            total = total - (total * (discount / 100));
            document.getElementById('total').innerHTML = `Total: ₹${total}`;
        }

        // Function to print to PDF
        function printToPdf() {
            const pdf = new jsPDF();
            pdf.text('Invoice', 10, 10);
            pdf.text('-------------------------', 10, 20);
            cart.forEach((item, index) => {
                pdf.text(`Barcode: ${item.barcode}`, 10, 30 + index * 10);
                pdf.text(`Quantity: ${item.quantity}`, 10, 40 + index * 10);
                pdf.text(`Price: ₹${item.price}`, 10, 50 + index * 10);
                pdf.text(`Subtotal: ₹${item.price * item.quantity}`, 10, 60 + index * 10);
            });
            pdf.text(`Total: ₹${total}`, 10, 70);
            pdf.save('invoice.pdf');
        }

        // Add event listeners
        document.getElementById('cart-items').addEventListener('click', (e) => {
            if (e.target.classList.contains('delete-btn')) {
                const index = e.target.dataset.index;
                cart.splice(index, 1);
                updateCart();
            }
        });

        document.getElementById('apply-discount').addEventListener('click', applyDiscount);

        document.getElementById('print-btn').addEventListener('click', printToPdf);

        // Initialize the camera
        const video = document.createElement('video');
        video.width = 640;
        video.height = 480;
        document.body.appendChild(video);

        navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
                video.srcObject = stream;
                video.play();
            })
            .catch((error) => {
                console.error('Error accessing camera:', error);
            });

        // Define the barcode and QR code scanning functions
        function scanBarcode() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 640, 480);
            const imageData = ctx.getImageData(0, 0, 640, 480);
            const code = jsQR(imageData.data, 640, 480);
            if (code) {
                const barcode = code.data;
                const item = barcodeData[barcode];
                if (item) {
                    addItemToCart(item);
                } else {
                    console.log(`Unknown barcode: ${barcode}`);
                }
            }
        }

        function scanQR() {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 640, 480);
            const imageData = ctx.getImageData(0, 0, 640, 480);
            const code = jsQR(imageData.data, 640, 480);
            if (code) {
                const qrCode = code.data;
                console.log(`Scanned QR code: ${qrCode}`);
            }
        }

        // Add event listener to scan button
        document.getElementById('scan-btn').addEventListener('click', scanBarcode);

        // Scan QR code every second
        setInterval(scanQR, 1000);
    </script>
</body>
</html>
