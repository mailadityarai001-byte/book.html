<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR Code Scanner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #f3f4f6 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: var(--text-light);
            font-size: clamp(0.9rem, 3vw, 1rem);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .card {
            background: var(--card);
            border-radius: 1rem;
            padding: clamp(1rem, 3vw, 2rem);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon {
            width: 1.5rem;
            height: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Scanner Section */
        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 0.75rem;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #canvas {
            display: none;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            aspect-ratio: 1;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(79, 70, 229, 0.3);
            }
            50% {
                box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(79, 70, 229, 0.6);
            }
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid var(--primary);
        }

        .corner.top-left {
            top: calc(50% - 40% - 10px);
            left: calc(50% - 40% - 10px);
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: calc(50% - 40% - 10px);
            right: calc(50% - 40% - 10px);
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: calc(50% - 40% - 10px);
            left: calc(50% - 40% - 10px);
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: calc(50% - 40% - 10px);
            right: calc(50% - 40% - 10px);
            border-left: none;
            border-top: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            flex: 1;
            justify-content: center;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Items List */
        .items-list {
            max-height: 50vh;
            overflow-y: auto;
            margin-bottom: 1.5rem;
        }

        .items-list::-webkit-scrollbar {
            width: 6px;
        }

        .items-list::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 10px;
        }

        .items-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .items-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }

        .item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--bg);
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            animation: slideInLeft 0.3s ease-out;
            border-left: 4px solid var(--primary);
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-barcode {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--text-light);
            word-break: break-all;
            margin-bottom: 0.25rem;
        }

        .item-price-input {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: 0.5rem;
        }

        .item-price-input input {
            width: 80px;
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }

        .item-price-input input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .item-price-display {
            font-weight: 600;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .item-qty {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            border-radius: 0.35rem;
            padding: 0.25rem;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--border);
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--primary);
            color: white;
        }

        .qty-display {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
        }

        .item-total {
            font-weight: 700;
            color: var(--success);
            font-size: 1rem;
            min-width: 80px;
            text-align: right;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .item-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 0.35rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .item-btn-edit {
            background: var(--warning);
            color: white;
        }

        .item-btn-edit:hover {
            background: #d97706;
        }

        .item-btn-delete {
            background: var(--danger);
            color: white;
        }

        .item-btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-light);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Summary Section */
        .summary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .summary-row.total {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .summary-label {
            opacity: 0.9;
        }

        .summary-value {
            font-weight: 600;
        }

        /* Discount Section */
        .discount-section {
            margin-bottom: 1.5rem;
        }

        .discount-toggle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .discount-toggle:hover {
            background: var(--border);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .discount-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            animation: slideDown 0.3s ease-out;
        }

        @media (max-width: 600px) {
            .discount-inputs {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .input-group input {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .modal-body {
            margin-bottom: 1.5rem;
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            animation: slideInLeft 0.3s ease-out;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 400px;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.info {
            border-left: 4px solid var(--primary);
        }

        @media (max-width: 600px) {
            .toast {
                right: 1rem;
                left: 1rem;
                bottom: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                flex: 1;
                min-width: auto;
            }

            .item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .summary {
                padding: 1rem;
            }

            .modal-content {
                padding: 1.5rem;
            }
        }

        /* Edit Modal */
        .edit-modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .edit-modal-body .input-group {
            width: 100%;
        }

        .edit-modal-body .input-group input {
            width: 100%;
        }

        /* Receipt Styles */
        .receipt-container {
            width: 100%;
            background: white;
            padding: 2rem;
            font-family: 'Courier New', monospace;
        }

        .receipt-header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #000;
            padding-bottom: 1rem;
        }

        .receipt-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .receipt-subtitle {
            font-size: 0.9rem;
            color: #666;
        }

        .receipt-items {
            margin-bottom: 1.5rem;
        }

        .receipt-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .receipt-footer {
            border-top: 2px solid #000;
            padding-top: 1rem;
            text-align: center;
        }

        .receipt-timestamp {
            font-size: 0.85rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📱 Scanner Pro</h1>
            <p>Barcode & QR Code Scanner with Receipt Generator</p>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Scanner Section -->
            <div class="card">
                <div class="card-title">
                    <span class="icon">📷</span>
                    Scanner
                </div>

                <div class="scanner-container">
                    <video id="video" playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="scanner-overlay"></div>
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" id="startBtn">▶ Start Camera</button>
                    <button class="btn btn-secondary" id="stopBtn" disabled>⏹ Stop Camera</button>
                    <button class="btn btn-secondary" id="toggleFlash">💡 Flash</button>
                </div>

                <div class="controls">
                    <button class="btn btn-secondary" id="manualAddBtn">➕ Add Manually</button>
                    <button class="btn btn-danger" id="clearAllBtn">🗑 Clear All</button>
                </div>
            </div>

            <!-- Items & Summary Section -->
            <div>
                <!-- Items List -->
                <div class="card">
                    <div class="card-title">
                        <span class="icon">📦</span>
                        Items (<span id="itemCount">0</span>)
                    </div>

                    <div class="items-list" id="itemsList">
                        <div class="empty-state">
                            <p>No items added yet. Start scanning!</p>
                        </div>
                    </div>
                </div>

                <!-- Discount Section -->
                <div class="card discount-section">
                    <label class="discount-toggle">
                        <input type="checkbox" class="checkbox" id="discountToggle">
                        <span>Apply Discount</span>
                    </label>

                    <div class="discount-inputs" id="discountInputs" style="display: none;">
                        <div class="input-group">
                            <label>Discount Type</label>
                            <select id="discountType" style="padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem;">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (₹)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Discount Value</label>
                            <input type="number" id="discountValue" placeholder="Enter value" min="0" step="0.01">
                        </div>
                    </div>
                </div>

                <!-- Summary Section -->
                <div class="summary">
                    <div class="summary-row">
                        <span class="summary-label">Subtotal:</span>
                        <span class="summary-value">₹<span id="subtotal">0.00</span></span>
                    </div>
                    <div class="summary-row">
                        <span class="summary-label">Discount:</span>
                        <span class="summary-value">₹<span id="discountAmount">0.00</span></span>
                    </div>
                    <div class="summary-row total">
                        <span class="summary-label">Total Amount:</span>
                        <span class="summary-value">₹<span id="totalAmount">0.00</span></span>
                    </div>
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button class="btn btn-success" id="generateReceiptBtn" style="flex: 1;">📄 Generate Receipt</button>
                        <button class="btn btn-secondary" id="resetBtn" style="flex: 1;">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Item</div>
            <div class="modal-body edit-modal-body">
                <div class="input-group">
                    <label>Barcode</label>
                    <input type="text" id="editBarcode" readonly>
                </div>
                <div class="input-group">
                    <label>Price (₹)</label>
                    <input type="number" id="editPrice" min="0" step="0.01">
                </div>
                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" id="editQty" min="1" step="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="saveEditBtn">Save</button>
                <button class="btn btn-secondary" id="cancelEditBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Manual Add Modal -->
    <div class="modal" id="manualAddModal">
        <div class="modal-content">
            <div class="modal-header">Add Item Manually</div>
            <div class="modal-body edit-modal-body">
                <div class="input-group">
                    <label>Barcode/ID</label>
                    <input type="text" id="manualBarcode" placeholder="Enter barcode or item ID">
                </div>
                <div class="input-group">
                    <label>Price (₹)</label>
                    <input type="number" id="manualPrice" placeholder="Enter price" min="0" step="0.01" value="100">
                </div>
                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" id="manualQty" placeholder="Enter quantity" min="1" step="1" value="1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="confirmManualAddBtn">Add Item</button>
                <button class="btn btn-secondary" id="cancelManualAddBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal" id="receiptModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">Receipt Preview</div>
            <div class="modal-body" id="receiptContent"></div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="downloadPdfBtn">📥 Download PDF</button>
                <button class="btn btn-secondary" id="printReceiptBtn">🖨 Print</button>
                <button class="btn btn-secondary" id="closeReceiptBtn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        const state = {
            items: [],
            isScanning: false,
            currentEditIndex: null,
            stream: null,
            torchSupported: false
        };

        // ==================== DOM ELEMENTS ====================
        const elements = {
            video: document.getElementById('video'),
            canvas: document.getElementById('canvas'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            toggleFlash: document.getElementById('toggleFlash'),
            manualAddBtn: document.getElementById('manualAddBtn'),
            clearAllBtn: document.getElementById('clearAllBtn'),
            itemsList: document.getElementById('itemsList'),
            itemCount: document.getElementById('itemCount'),
            subtotal: document.getElementById('subtotal'),
            discountAmount: document.getElementById('discountAmount'),
            totalAmount: document.getElementById('totalAmount'),
            discountToggle: document.getElementById('discountToggle'),
            discountInputs: document.getElementById('discountInputs'),
            discountType: document.getElementById('discountType'),
            discountValue: document.getElementById('discountValue'),
            generateReceiptBtn: document.getElementById('generateReceiptBtn'),
            resetBtn: document.getElementById('resetBtn'),
            editModal: document.getElementById('editModal'),
            editBarcode: document.getElementById('editBarcode'),
            editPrice: document.getElementById('editPrice'),
            editQty: document.getElementById('editQty'),
            saveEditBtn: document.getElementById('saveEditBtn'),
            cancelEditBtn: document.getElementById('cancelEditBtn'),
            manualAddModal: document.getElementById('manualAddModal'),
            manualBarcode: document.getElementById('manualBarcode'),
            manualPrice: document.getElementById('manualPrice'),
            manualQty: document.getElementById('manualQty'),
            confirmManualAddBtn: document.getElementById('confirmManualAddBtn'),
            cancelManualAddBtn: document.getElementById('cancelManualAddBtn'),
            receiptModal: document.getElementById('receiptModal'),
            receiptContent: document.getElementById('receiptContent'),
            downloadPdfBtn: document.getElementById('downloadPdfBtn'),
            printReceiptBtn: document.getElementById('printReceiptBtn'),
            closeReceiptBtn: document.getElementById('closeReceiptBtn')
        };

        // ==================== CAMERA FUNCTIONS ====================
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                elements.video.srcObject = state.stream;

                // Check if torch is supported
                const track = state.stream.getVideoTracks();
                const capabilities = track.getCapabilities();
                state.torchSupported = capabilities && capabilities.torch !== undefined;

                state.isScanning = true;
                elements.startBtn.disabled = true;
                elements.stopBtn.disabled = false;
                elements.toggleFlash.disabled = !state.torchSupported;

                showToast('Camera started', 'success');
                scanLoop();
            } catch (error) {
                showToast('Camera access denied: ' + error.message, 'error');
                console.error('Camera error:', error);
            }
        }

        function stopCamera() {
            if (state.stream) {
                state.stream.getTracks().forEach(track => track.stop());
                state.isScanning = false;
                elements.startBtn.disabled = false;
                elements.stopBtn.disabled = true;
                elements.toggleFlash.disabled = true;
                showToast('Camera stopped', 'info');
            }
        }

        async function toggleFlash() {
            if (!state.torchSupported) return;

            try {
                const track = state.stream.getVideoTracks();
                const settings = track.getSettings();
                const newTorchState = !settings.torch;

                await track.applyConstraints({
                    advanced: [{ torch: newTorchState }]
                });

                elements.toggleFlash.style.opacity = newTorchState ? '1' : '0.5';
                showToast(newTorchState ? 'Flash ON' : 'Flash OFF', 'info');
            } catch (error) {
                showToast('Torch control not available', 'error');
            }
        }

        // ==================== SCANNING LOGIC ====================
        function scanLoop() {
            if (!state.isScanning) return;

            const ctx = elements.canvas.getContext('2d');
            elements.canvas.width = elements.video.videoWidth;
            elements.canvas.height = elements.video.videoHeight;

            ctx.drawImage(elements.video, 0, 0, elements.canvas.width, elements.canvas.height);
            const imageData = ctx.getImageData(0, 0, elements.canvas.width, elements.canvas.height);

            // Try QR code detection
            const qrCode = jsQR(imageData.data, imageData.width, imageData.height);
            if (qrCode) {
                handleScannedCode(qrCode.data);
                return;
            }

            // Continue scanning
            requestAnimationFrame(scanLoop);
        }

        function handleScannedCode(code) {
            // Check if item already exists
            const existingItem = state.items.find(item => item.barcode === code);

            if (existingItem) {
                existingItem.qty++;
                showToast(`Updated quantity: ${existingItem.qty}`, 'info');
            } else {
                state.items.push({
                    barcode: code,
                    price: 100,
                    qty: 1
                });
                showToast('Item scanned successfully', 'success');
            }

            updateUI();
        }

        // ==================== ITEM MANAGEMENT ====================
        function addItem(barcode, price = 100, qty = 1) {
            const existingItem = state.items.find(item => item.barcode === barcode);

            if (existingItem) {
                existingItem.qty += qty;
                showToast('Item quantity updated', 'info');
            } else {
                state.items.push({
                    barcode,
                    price: parseFloat(price),
                    qty: parseInt(qty)
                });
                showToast('Item added successfully', 'success');
            }

            updateUI();
        }

        function updateItem(index, price, qty) {
            if (index >= 0 && index < state.items.length) {
                state.items[index].price = parseFloat(price);
                state.items[index].qty = parseInt(qty);
                updateUI();
                showToast('Item updated', 'success');
            }
        }

        function deleteItem(index) {
            if (index >= 0 && index < state.items.length) {
                const item = state.items[index];
                state.items.splice(index, 1);
                updateUI();
                showToast(`${item.barcode} removed`, 'info');
            }
        }

        function clearAllItems() {
            if (state.items.length === 0) {
                showToast('No items to clear', 'info');
                return;
            }

            if (confirm('Are you sure you want to clear all items?')) {
                state.items = [];
                updateUI();
                showToast('All items cleared', 'success');
            }
        }

        // ==================== UI UPDATES ====================
        function updateUI() {
            renderItems();
            updateSummary();
        }

        function renderItems() {
            if (state.items.length === 0) {
                elements.itemsList.innerHTML = `
                    <div class="empty-state">
                        <p>No items added yet. Start scanning!</p>
                    </div>
                `;
                elements.itemCount.textContent = '0';
                return;
            }

            elements.itemCount.textContent = state.items.length;
            elements.itemsList.innerHTML = state.items.map((item, index) => {
                const itemTotal = (item.price * item.qty).toFixed(2);
                return `
                    <div class="item">
                        <div class="item-content">
                            <div class="item-barcode">ID: ${item.barcode}</div>
                            <div class="item-price-display">₹${item.price.toFixed(2)}</div>
                        </div>
                        <div class="item-qty">
                            <button class="qty-btn" data-action="decrease" data-index="${index}">−</button>
                            <div class="qty-display">${item.qty}</div>
                            <button class="qty-btn" data-action="increase" data-index="${index}">+</button>
                        </div>
                        <div class="item-total">₹${itemTotal}</div>
                        <div class="item-actions">
                            <button class="item-btn item-btn-edit" data-action="edit" data-index="${index}">✏</button>
                            <button class="item-btn item-btn-delete" data-action="delete" data-index="${index}">🗑</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Attach event listeners to item buttons
            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', handleItemAction);
            });
        }

        function handleItemAction(e) {
            const action = e.target.dataset.action;
            const index = parseInt(e.target.dataset.index);

            switch (action) {
                case 'increase':
                    state.items[index].qty++;
                    updateUI();
                    break;
                case 'decrease':
                    if (state.items[index].qty > 1) {
                        state.items[index].qty--;
                        updateUI();
                    }
                    break;
                case 'edit':
                    openEditModal(index);
                    break;
                case 'delete':
                    deleteItem(index);
                    break;
            }
        }

        function updateSummary() {
            let subtotal = 0;

            state.items.forEach(item => {
                subtotal += item.price * item.qty;
            });

            let discountAmount = 0;
            if (elements.discountToggle.checked) {
                const discountType = elements.discountType.value;
                const discountValue = parseFloat(elements.discountValue.value) || 0;

                if (discountType === 'percentage') {
                    discountAmount = (subtotal * discountValue) / 100;
                } else {
                    discountAmount = discountValue;
                }
            }

            const total = Math.max(0, subtotal - discountAmount);

            elements.subtotal.textContent = subtotal.toFixed(2);
            elements.discountAmount.textContent = discountAmount.toFixed(2);
            elements.totalAmount.textContent = total.toFixed(2);
        }

        // ==================== MODAL FUNCTIONS ====================
        function openEditModal(index) {
            state.currentEditIndex = index;
            const item = state.items[index];

            elements.editBarcode.value = item.barcode;
            elements.editPrice.value = item.price.toFixed(2);
            elements.editQty.value = item.qty;

            elements.editModal.classList.add('active');
        }

        function closeEditModal() {
            elements.editModal.classList.remove('active');
            state.currentEditIndex = null;
        }

        function openManualAddModal() {
            elements.manualBarcode.value = '';
            elements.manualPrice.value = '100';
            elements.manualQty.value = '1';
            elements.manualAddModal.classList.add('active');
            elements.manualBarcode.focus();
        }

        function closeManualAddModal() {
            elements.manualAddModal.classList.remove('active');
        }

        function openReceiptModal(receiptHTML) {
            elements.receiptContent.innerHTML = receiptHTML;
            elements.receiptModal.classList.add('active');
        }

        function closeReceiptModal() {
            elements.receiptModal.classList.remove('active');
        }

        // ==================== RECEIPT GENERATION ====================
        function generateReceiptHTML() {
            const subtotal = parseFloat(elements.subtotal.textContent);
            const discount = parseFloat(elements.discountAmount.textContent);
            const total = parseFloat(elements.totalAmount.textContent);
            const timestamp = new Date().toLocaleString('en-IN');

            let itemsHTML = state.items.map(item => {
                const itemTotal = (item.price * item.qty).toFixed(2);
                return `
                    <div class="receipt-item-row">
                        <span>${item.barcode}</span>
                        <span>₹${item.price.toFixed(2)} x ${item.qty}</span>
                        <span>₹${itemTotal}</span>
                    </div>
                `;
            }).join('');

            const discountRow = discount > 0 ? `
                <div class="receipt-item-row">
                    <span style="font-weight: bold;">Discount:</span>
                    <span></span>
                    <span style="font-weight: bold;">-₹${discount.toFixed(2)}</span>
                </div>
            ` : '';

            return `
                <div class="receipt-container">
                    <div class="receipt-header">
                        <div class="receipt-title">RECEIPT</div>
                        <div class="receipt-subtitle">Scanner Pro</div>
                    </div>

                    <div class="receipt-items">
                        <div class="receipt-item-row" style="font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
                            <span>Item ID</span>
                            <span>Price x Qty</span>
                            <span>Total</span>
                        </div>
                        ${itemsHTML}
                    </div>

                    <div style="border-top: 1px solid #ccc; padding-top: 0.5rem; margin-bottom: 1rem;">
                        <div class="receipt-item-row">
                            <span>Subtotal:</span>
                            <span></span>
                            <span>₹${subtotal.toFixed(2)}</span>
                        </div>
                        ${discountRow}
                        <div class="receipt-item-row" style="font-weight: bold; font-size: 1.1rem;">
                            <span>TOTAL:</span>
                            <span></span>
                            <span>₹${total.toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="receipt-footer">
                        <div class="receipt-timestamp">
                            Date: ${timestamp}<br>
                            Thank you for your purchase!
                        </div>
                    </div>
                </div>
            `;
        }

        function downloadReceiptPDF() {
            const element = elements.receiptContent;
            const opt = {
                margin: 10,
                filename: `receipt-${new Date().getTime()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
            showToast('Receipt downloaded as PDF', 'success');
        }

        function printReceipt() {
            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write(elements.receiptContent.innerHTML);
            printWindow.document.close();
            printWindow.print();
        }

        // ==================== UTILITY FUNCTIONS ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideInLeft 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==================== EVENT LISTENERS ====================
        elements.startBtn.addEventListener('click', startCamera);
        elements.stopBtn.addEventListener('click', stopCamera);
        elements.toggleFlash.addEventListener('click', toggleFlash);
        elements.manualAddBtn.addEventListener('click', openManualAddModal);
        elements.clearAllBtn.addEventListener('click', clearAllItems);

        // Edit Modal Events
        elements.saveEditBtn.addEventListener('click', () => {
            if (state.currentEditIndex !== null) {
                updateItem(
                    state.currentEditIndex,
                    elements.editPrice.value,
                    elements.editQty.value
                );
                closeEditModal();
            }
        });

        elements.cancelEditBtn.addEventListener('click', closeEditModal);

        // Manual Add Modal Events
        elements.confirmManualAddBtn.addEventListener('click', () => {
            const barcode = elements.manualBarcode.value.trim();
            const price = elements.manualPrice.value;
            const qty = elements.manualQty.value;

            if (!barcode) {
                showToast('Please enter a barcode/ID', 'error');
                return;
            }

            addItem(barcode, price, qty);
            closeManualAddModal();
        });

        elements.cancelManualAddBtn.addEventListener('click', closeManualAddModal);

        // Enter key in manual add modal
        elements.manualBarcode.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') elements.manualPrice.focus();
        });

        elements.manualPrice.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') elements.manualQty.focus();
        });

        elements.manualQty.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') elements.confirmManualAddBtn.click();
        });

        // Discount Events
        elements.discountToggle.addEventListener('change', () => {
            elements.discountInputs.style.display = elements.discountToggle.checked ? 'grid' : 'none';
            updateSummary();
        });

        elements.discountType.addEventListener('change', updateSummary);
        elements.discountValue.addEventListener('input', updateSummary);

        // Receipt Events
        elements.generateReceiptBtn.addEventListener('click', () => {
            if (state.items.length === 0) {
                showToast('Add items before generating receipt', 'error');
                return;
            }

            const receiptHTML = generateReceiptHTML();
            openReceiptModal(receiptHTML);
        });

        elements.downloadPdfBtn.addEventListener('click', downloadReceiptPDF);
        elements.printReceiptBtn.addEventListener('click', printReceipt);
        elements.closeReceiptBtn.addEventListener('click', closeReceiptModal);

        // Reset Events
        elements.resetBtn.addEventListener('click', () => {
            if (confirm('Reset all data? This cannot be undone.')) {
                state.items = [];
                elements.discountToggle.checked = false;
                elements.discountInputs.style.display = 'none';
                elements.discountValue.value = '';
                updateUI();
                showToast('All data reset', 'success');
            }
        });

        // Close modals on outside click
        [elements.editModal, elements.manualAddModal, elements.receiptModal].forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEditModal();
                closeManualAddModal();
                closeReceiptModal();
            }
        });

        // Initialize
        updateUI();
        showToast('App ready! Click "Start Camera" to begin', 'info');
    </script>
</body>
</html>
